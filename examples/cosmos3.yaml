# The ego's cameras and ray-cast LiDAR generated by Cosmos3-Nano-Sim-Auto (cosmos3_canvas), through carla_canvas.
# The renderer runs in its own environment (the cosmos-framework venv with carla-canvas, roadgen and the
# cookbook's control renderers on top), without the run's PYTHONPATH / LD_LIBRARY_PATH.
renderer:
  backend: cosmos3_canvas:Cosmos3Renderer
  endpoint: "localhost:50552"
  # Close the run's descriptors (the Traffic Manager socket among them) before exec.
  command: [env, -u, PYTHONPATH, -u, LD_LIBRARY_PATH, "PATH=/home/masaya-kataoka/.local/bin:/usr/bin:/bin",
            /home/masaya-kataoka/workspace/cosmos3/canvas-venv/bin/python, -c,
            "import os, sys; os.closerange(3, os.sysconf('SC_OPEN_MAX')); os.execv(sys.argv[1], sys.argv[1:])",
            /home/masaya-kataoka/workspace/cosmos3/canvas-venv/bin/carla-canvas, serve, --config, "{config}"]
  startup_timeout: 900   # LoadWorld: the model loads
  timeout: 600           # a tick that generates a chunk (~8 s with one camera on an RTX PRO 6000)
  options:
    checkpoint: /home/masaya-kataoka/workspace/cosmos3/Cosmos3-Nano-Sim-Auto
    workdir: /tmp/cosmos3_canvas
    cameras: [camera_front_wide_120fov]
    caption: "A daytime drive through a dry, sunlit city street with clear lane markings, buildings and trees on both sides."
    horizon_seconds: 40
    seed: 0
    resolution: "480"
    actors: ["vehicle.*", "walker.pedestrian.*"]
sensors:
  - sensor.lidar.ray_cast
  - sensor.camera.rgb
